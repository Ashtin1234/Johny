<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungulge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Savate:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
<style>
    @font-face{
        src:url(Fonts/Bitcount.ttf);
        font-family:"Bitcount";
    }
    h1{
    font-family: "Gravitas One";
    }
    h2{
        font-family: "Bitcount" ;
    }

    .container{
        display: flex;
        height: 300px;
        flex-wrap: wrap-reverse;
        row-gap: 5px;
        column-gap: 5px;
        flex-direction: row-reverse;
        justify-content: space-evenly;   
        }
    .boxes{
       height: 300px;
        width: 150px;
    } 
    #box1{
        font-size: 30px;
        background-color: red;
        align-self: center;
        order: 0;
        color: white;
        text-shadow: 3px 3px 3px black, -3px -3px 3px blue;
    }
    #box2{
        font-size: 30px;
        background-color: orange;
        color: white;
        text-shadow: 3px 3px 3px black, -3px -3px 3px blue;
    }
    #box3{
        font-size: 30px;
        background-color: yellow;
        color: white;
        text-shadow: 3px 3px 3px black, -3px -3px 3px blue;
    }
    #box4{
        font-size: 30px;
        background-color: green;
        align-self:center;
        color: white;
        text-shadow: 3px 3px 3px black, -3px -3px 3px blue;  
    }
    #box5{
        font-size: 30px;
        text-shadow: 3px 3px 3px black, -3px -3px 3px blue;
        box-shadow: 10px 10px 10px 5px red, -10px -10px 10px 5px green ;
    }
    #box6{
        font-size: 30px;
        background-color: purple;
    }
    #box7{
        font-size: 30px;
        background-color: pink;
    }
    #box8{
        font-size: 30px;
        background-color: gray;
    }
    .container1{
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
    }
    .boxchallenge{
        font-size: 30px;
        height: 30px;
        width: 200px;
        background-color: red;
        align-items: center;
        justify-content: center;
        color: white;
        text-shadow: 3px 3px 3px black, -3px -3px 3px blue;
        box-shadow: 3px 3px 3px rgb(11, 231, 255);
    }
</style>
</head>
<body>
    <h1>FONT FAMILIES DUNGULGE DUNGULGGE</h1>
    <h2>Bitcount</h2>
<div class="container">
    <div class="boxes" id="box1">1</div>    
    <div class="boxes" id="box2">2</div> 
    <div class="boxes" id="box3">3</div> 
    <div class="boxes" id="box4">4</div> 
    <div class="boxes" id="box5">5</div>  
    <div class="boxes" id="box6">6</div> 
    <div class="boxes" id="box7">7</div> 
    <div class="boxes" id="box8">8</div> 
    </div>
    <div class="container1">
        <div class="boxchallenge">CHALLENGE</div>
    
    </div>
    
</body>
</html>
